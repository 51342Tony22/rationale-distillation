seed: 7
seeds: [7, 17, 177]

data:
  dataset: openai/gsm8k
  config: main
  train_file: data/processed/gsm8k_train.jsonl
  dev_file: data/processed/gsm8k_dev.jsonl
  test_file: data/processed/gsm8k_test.jsonl
  svamp_file: data/processed/svamp_test.jsonl
  validation_size: 500
  teacher_file: data/teacher/gsm8k_rationales.jsonl
  variants_dir: data/variants
  rationale_candidates: 5
  selected_rationales: 3

teacher:
  temperature: 0.8
  max_tokens: 256
  reasoning_effort: low
  concurrency: 8
  question_concurrency: 4
  request_timeout_seconds: 60
  max_retries: 2

student:
  model: Qwen/Qwen3-1.7B-Base
  max_length: 768
  trust_remote_code: false

training:
  num_train_epochs: 3
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 100
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

mlx_training:
  model: mlx-community/Qwen3-0.6B-Base-4bit
  num_train_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  num_layers: -1
  lora_r: 16
  lora_scale: 2.0
  lora_dropout: 0.05
  max_length: 768
  logging_steps: 20
  save_steps: 400

evaluation:
  max_new_tokens: 256
  batch_size: 1
  stochastic_samples: 5
  behavioural_limit: 200
  temperature: 0.7
  bootstrap_samples: 10000
  prompt_templates:
    - "Solve the following problem step by step. End with `Final answer: <number>`.\n\n{question}"
    - "Reason carefully about this maths question, then write `Final answer: <number>`.\n\n{question}"
    - "Find the answer. Show your reasoning and finish with `Final answer: <number>`.\n\n{question}"
